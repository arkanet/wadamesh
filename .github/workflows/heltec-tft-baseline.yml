name: Heltec TFT baseline build

on:
  push:
    branches:
      - 'TFT-SPI-480×320'
    paths:
      - '.github/workflows/heltec-tft-baseline.yml'
      - 'src/**'
      - 'lib/**'
      - 'test/p04_sd_mount/**'
      - 'variants/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    # Run stable ST7789 regression after experimental P02 has compiled.
    needs: [p02-ili9488]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare PlatformIO
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install "platformio>=6.2.0,<7"
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: Compile heltec_v4_tft_companion_radio_usb_tcp_touch
        shell: bash
        run: |
          set -o pipefail
          pio run -e 'heltec_v4_tft_companion_radio_usb_tcp_touch' 2>&1 | tee firmware-build.log
      - name: Save logs
        # Artefact hosting can stall independently of a successful compiler.
        # Keep compile verdict authoritative; bound uploads and surface warnings.
        continue-on-error: true
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-build-log
          path: firmware-build.log
          if-no-files-found: ignore
      - name: Save firmware
        # Artefact hosting can stall independently of a successful compiler.
        # Keep compile verdict authoritative; bound uploads and surface warnings.
        continue-on-error: true
        timeout-minutes: 3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-firmware
          # Avoid large ELF/MAP uploads: the previous run compiled successfully
          # but upload-artifact stalled after 16 MiB on this self-hosted runner.
          path: .pio/build/heltec_v4_tft_companion_radio_usb_tcp_touch/firmware.bin
          compression-level: 0
          if-no-files-found: warn

  p02-ili9488:
    name: P02 / ILI9488 320x480 compile-only
    needs: [p03-xpt2046]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare PlatformIO
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install "platformio>=6.2.0,<7"
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: Compile external ILI9488 (NO FLASH)
        shell: bash
        run: |
          set -o pipefail
          pio run -e heltec_v4_r2_ili9488_p02 2>&1 | tee firmware-p02.log
      - name: Save P02 logs
        # Artefact hosting can stall independently of a successful compiler.
        # Keep compile verdict authoritative; bound uploads and surface warnings.
        continue-on-error: true
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-ili9488-build-log
          path: firmware-p02.log
          if-no-files-found: ignore
      - name: Save P02 firmware for review (DO NOT FLASH)
        # Artefact hosting can stall independently of a successful compiler.
        # Keep compile verdict authoritative; bound uploads and surface warnings.
        continue-on-error: true
        timeout-minutes: 3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p02-ili9488-untested-do-not-flash
          # P02 is compile-only; keep the review artifact minimal.
          path: .pio/build/heltec_v4_r2_ili9488_p02/firmware.bin
          compression-level: 0
          if-no-files-found: warn

  p03-xpt2046:
    name: P03 / XPT2046 touch + ILI9488 (compile-only)
    needs: [p04-sd-maps]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare PlatformIO
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install "platformio>=6.2.0,<7"
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: Compile optional XPT2046 touch firmware (NO FLASH)
        shell: bash
        run: |
          set -o pipefail
          pio run -e heltec_v4_r2_ili9488_p03 2>&1 | tee firmware-p03.log
      - name: Save P03 compiler log
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: p03-xpt2046-build-log
          path: firmware-p03.log
          if-no-files-found: ignore
      - name: Save P03 BIN for review (DO NOT FLASH)
        if: success()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: p03-xpt2046-untested-do-not-flash
          path: .pio/build/heltec_v4_r2_ili9488_p03/firmware.bin
          compression-level: 0
          if-no-files-found: warn

  p04-sd-maps:
    name: P04 / external microSD offline maps (compile-only)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test P04 SD mount, backoff and recovery on host
        run: python3 test/p04_sd_mount/run.py
      - name: Prepare PlatformIO
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install "platformio>=6.2.0,<7"
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: Compile P04 SPI2 microSD and offline maps (NO FLASH)
        shell: bash
        run: |
          set -o pipefail
          pio run -e heltec_v4_r2_ili9488_p04 2>&1 | tee firmware-p04.log
      - name: Preserve P04 build log
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: p04-microsd-maps-build-log
          path: firmware-p04.log
          if-no-files-found: ignore
      - name: Preserve P04 firmware (DO NOT FLASH)
        if: success()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: p04-microsd-maps-do-not-flash
          path: .pio/build/heltec_v4_r2_ili9488_p04/firmware.bin
          compression-level: 0
          if-no-files-found: warn
